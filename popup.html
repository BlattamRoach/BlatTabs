<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 240px; font-family: system-ui, sans-serif; padding: 14px; }

    .save-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #3498db; color: white; margin-bottom: 12px; }
    .save-btn:hover { background: #2980b9; }

    .plus-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 24px; background: white; color: #3498db; margin-bottom: 8px; }
    .plus-btn:hover { background: #f5f5f5; }

    hr { border: none; border-top: 1px solid #eee; margin: 0 0 12px; }
  </style>
</head>
<body>
  <button class="save-btn" id="save-current-tab">💾 Сохранить текущую вкладку</button>

  <hr>

  <button class="plus-btn" id="open-view">+</button>

  <script src="popup.js"></script>
</body>
</html>
