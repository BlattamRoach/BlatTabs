<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 260px; font-family: system-ui, sans-serif; padding: 14px; }

    label { display: block; font-size: 11px; color: var(--text-soft); margin-bottom: 4px; }

    select { 
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; 
      font-size: 12px; background: var(--surface); cursor: pointer; margin-bottom: 8px; outline: none;
    }
    select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

    .save-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: var(--accent); color: var(--on-accent); margin-bottom: 8px; }
    .save-btn:hover { background: var(--accent-hover); }

    .saved-msg { width: 100%; text-align: center; font-size: 12px; color: var(--success); min-height: 18px; opacity: 0; transition: opacity 0.3s; }
    .saved-msg.show { opacity: 1; }

    .add-folder-btn { 
      width: 100%; padding: 6px; border: 1px dashed var(--dashed-soft); background: var(--surface-soft); 
      border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--text-muted); margin-bottom: 8px;
    }
    .add-folder-btn:hover { background: var(--btn-soft); border-color: var(--dashed-hover); }

    /* Модалка */
    .modal-overlay { 
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: var(--overlay); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    
    .modal { 
      background: var(--surface); border-radius: 8px; padding: 16px; min-width: 240px;
      box-shadow: var(--shadow-xl);
    }
    .modal h3 { font-size: 13px; margin-bottom: 10px; color: var(--text); }
    .modal input[type="text"] { 
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; 
      font-size: 12px; outline: none; margin-bottom: 10px; background: var(--surface);
    }
    .modal input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
    .modal-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .modal-btn { 
      padding: 5px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; 
      border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
    }
    .modal-btn:hover { background: var(--bg); }
    .modal-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent-hover); }
    .modal-btn.primary:hover { background: var(--accent-hover); }

  </style>
</head>
<body>
  <button class="save-btn" id="save-current-tab">💾 Сохранить вкладку</button>
  
  <label for="folder-select">📁 Папка:</label>
  <select id="folder-select">
    <option value="">Все (без папки)</option>
  </select>

  <button class="add-folder-btn" id="popup-add-folder">+ Новая папка</button>
  
  <div class="saved-msg" id="saved-msg">✓ Вкладка сохранена!</div>

  <!-- Модалка: создать папку -->
  <div class="modal-overlay" id="folder-modal">
    <div class="modal">
      <h3>Новая папка</h3>
      <input type="text" id="folder-name-input" placeholder="Название..." autocomplete="off">
      <div class="modal-actions">
        <button class="modal-btn" id="modal-cancel">Отмена</button>
        <button class="modal-btn primary" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
