<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 260px; font-family: system-ui, sans-serif; padding: 14px; }
    h2 { margin: 0 0 12px; font-size: 15px; }

    input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; margin-bottom: 12px; box-sizing: border-box; }
    .new-btn { width: 100%; padding: 9px 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #3498db; color: white; margin-bottom: 12px; }
    .new-btn:hover { background: #2980b9; }

    hr { margin: 12px 0; border: none; border-top: 1px solid #eee; }

    .view-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; background: white; color: #3498db; margin-bottom: 12px; }
    .view-btn:hover { background: #f5f5f5; }

    .item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-radius: 6px; cursor: pointer; user-select: none; }
    .item:hover { background: #f0f0f0; }
    .item-name { font-size: 14px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; background: #e0e0e0; margin-left: 6px; }
    .btn:hover { background: #d0d0e0; }
    .btn-delete { color: #c0392b; }
  </style>
</head>
<body>
  <h2>BlattamToby</h2>

  <input type="text" id="tab-name" placeholder="Название вкладки...">

  <button class="new-btn" id="save-current-tab">💾 Сохранить текущую вкладку</button>

  <hr>

  <div id="items"></div>

  <button class="view-btn" id="open-view">📋 Открыть view</button>

  <script src="popup.js"></script>
</body>
</html>
