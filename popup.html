<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 240px; font-family: system-ui, sans-serif; padding: 14px; }

    .save-btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #3498db; color: white; margin-bottom: 8px; }
    .save-btn:hover { background: #2980b9; }

    .saved-msg { width: 100%; text-align: center; font-size: 12px; color: #27ae60; min-height: 18px; opacity: 0; transition: opacity 0.3s; }
    .saved-msg.show { opacity: 1; }
  </style>
</head>
<body>
  <button class="save-btn" id="save-current-tab">💾 Сохранить текущую вкладку</button>
  <div class="saved-msg" id="saved-msg">✓ Вкладка сохранена!</div>

  <script src="popup.js"></script>
</body>
</html>
