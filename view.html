<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; flex-direction: column; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: white; border-bottom: 1px solid #e8e8e8; flex-shrink: 0; }
    .header h1 { font-size: 14px; color: #333; }
    .close-btn { width: 24px; height: 24px; border: none; background: #f0f0f0; border-radius: 50%; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #e0e0e0; }

    .container { flex: 1; overflow-y: auto; padding: 4px 8px; }

    .empty-state { text-align: center; padding: 60px 20px; color: #888; font-size: 13px; }

    .tabs-list { display: flex; flex-direction: column; gap: 2px; max-width: none; width: 100%; }

    .tab-card { background: white; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
    .tab-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

    .tab-header { padding: 4px 10px; cursor: pointer; display: flex; align-items: center; user-select: none; gap: 6px; min-height: 32px; }
    .tab-name { font-size: 13px; font-weight: 500; color: #333; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .tab-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
    .tab-card:hover .tab-actions { opacity: 1; }

    .icon-btn { width: 20px; height: 20px; border: none; background: #f5f5f5; border-radius: 3px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: #e0e0e0; }
    .icon-btn.delete { color: #c0392b; }

    .tab-url { padding: 0 10px 4px; font-size: 10px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-height: 12px; }

    .open-btn { padding: 4px 10px; width: 100%; border: none; background: #3498db; color: white; font-size: 11px; cursor: pointer; transition: background 0.15s; }
    .open-btn:hover { background: #2980b9; }

    .search-box { margin-bottom: 6px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; width: 100%; outline: none; }
    .search-box:focus { border-color: #3498db; box-shadow: 0 0 0 2px rgba(52,152,219,0.1); }

    .no-results { text-align: center; padding: 30px; color: #aaa; font-size: 12px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>BlattamToby</h1>
    <button class="close-btn" id="close">✕</button>
  </div>

  <div class="container">
    <input type="text" class="search-box" placeholder="Поиск по вкладам..." id="search">

    <div id="empty-state" class="empty-state" style="display:none;">Нет сохранённых вкладок</div>
    <div id="no-results" class="no-results">Ничего не найдено</div>

    <div id="tabs-list" class="tabs-list"></div>
  </div>

  <script src="view.js"></script>
</body>
</html>
