<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border-soft); flex-shrink: 0; }
    .header h1 { font-size: 14px; color: var(--text); }

    .close-btn { width: 24px; height: 24px; border: none; background: var(--btn-soft); border-radius: 50%; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: var(--btn-hover); }

    .container { flex: 1; overflow-y: auto; padding: 8px; }

    /* Папки */
    .folders-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; min-height: 32px; }
    
    .folder-chip { 
      padding: 4px 10px; border-radius: 16px; font-size: 11px; cursor: pointer; 
      background: var(--chip); color: var(--text-soft); user-select: none; transition: all 0.15s;
      display: flex; align-items: center; gap: 4px; border: none; font-family: inherit;
    }
    .folder-chip:hover { background: var(--chip-hover); }
    .folder-chip.active { background: var(--accent); color: var(--on-accent); }
    .folder-chip.active:hover { background: var(--accent-hover); }

    .folder-chip .chip-actions { display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s; }
    .folder-chip:hover .chip-actions { opacity: 1; }
    
    .chip-icon-btn { 
      width: 14px; height: 14px; border: none; background: rgba(0,0,0,0.1); 
      border-radius: 50%; cursor: pointer; font-size: 8px; display: flex; 
      align-items: center; justify-content: center; color: inherit; line-height: 1;
    }
    .chip-icon-btn:hover { background: rgba(0,0,0,0.2); }

    .add-folder-btn { 
      padding: 4px 10px; border-radius: 16px; font-size: 11px; cursor: pointer; 
      background: var(--chip); color: var(--text-soft); border: 1px dashed var(--dashed); transition: all 0.15s;
      font-family: inherit; display: flex; align-items: center; gap: 4px; white-space: nowrap;
    }
    .add-folder-btn:hover { background: var(--chip-hover); border-color: var(--dashed-hover); }

    /* Поиск */
    .search-box { margin-bottom: 8px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; width: 100%; outline: none; background: var(--surface); }
    .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }

    /* Карточки */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13px; }
    .no-results { text-align: center; padding: 30px; color: var(--text-faint); font-size: 12px; display: none; }

    .tabs-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; max-width: none; width: 100%; }

    .tab-card { background: var(--surface); border-radius: 4px; box-shadow: var(--shadow-sm); overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; cursor: pointer; }
    .tab-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .tab-card.dragging { opacity: 0.4; }
    .folder-chip.drag-over { background: var(--drop-over); color: var(--on-accent); }
    .tab-card.selected { outline: 2px solid var(--accent); outline-offset: -1px; }
    .tab-card.kbd-active { outline: 2px solid var(--kbd); outline-offset: -1px; }
    .tab-card.kbd-active.selected { outline: 2px solid var(--kbd); outline-offset: -1px; box-shadow: inset 0 0 0 2px var(--accent); }

    /* Выбор вкладок */
    .tab-select { width: 14px; height: 14px; flex-shrink: 0; cursor: pointer; accent-color: var(--accent); }
    .search-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .search-row .search-box { margin-bottom: 0; }
    .selection-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-lg); padding: 8px 12px; display: flex; align-items: center; gap: 8px; z-index: 500; font-size: 12px; }
    .selection-bar.hidden { display: none; }
    .selection-count { color: var(--text-soft); }

    .tab-header { padding: 8px 10px; display: flex; align-items: center; user-select: none; gap: 4px; min-height: 32px; }
    .tab-name { font-size: 11px; font-weight: 500; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3; }
    .tab-name-input { flex: 1; min-width: 0; font-size: 11px; font-weight: 500; color: var(--text); font-family: inherit; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 3px; outline: none; background: var(--accent-soft); }

    .tab-actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; align-items: center; }
    .tab-card:hover .tab-actions { opacity: 1; }

    /* Селектор папки на карточке */
    .folder-select-btn { 
      width: 18px; height: 18px; border: none; background: var(--surface-alt); border-radius: 3px; 
      cursor: pointer; font-size: 9px; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); position: relative;
    }
    .folder-select-btn:hover { background: var(--btn-hover); }

    /* Дропдаун папок */
    .folder-dropdown { 
      display: none; position: absolute; top: 100%; right: 0; z-index: 100; 
      background: var(--surface); border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow-pop);
      min-width: 140px; max-height: 200px; overflow-y: auto; padding: 2px 0;
    }
    .folder-dropdown.open { display: block; }
    
    .folder-dd-item { 
      padding: 6px 10px; font-size: 11px; cursor: pointer; color: var(--text); 
      display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .folder-dd-item:hover { background: var(--bg); }
    .folder-dd-item.all-folder { color: var(--text-muted); font-style: italic; }

    .icon-btn { width: 18px; height: 18px; border: none; background: var(--surface-alt); border-radius: 3px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: var(--btn-hover); }
    .icon-btn.delete { color: var(--danger); }

    .tab-url { padding: 0 10px; font-size: 9px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0; min-height: 12px; height: 14px; }

    /* Хедер действия */
    .header-actions { display: flex; gap: 6px; }
    .action-btn { padding: 4px 10px; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--text-soft); transition: background 0.15s, border-color 0.15s; }
    .action-btn:hover { background: var(--bg); border-color: var(--dashed); }

    /* Модальное окно для создания папки */
    .modal-overlay { 
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
      background: var(--overlay); z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    
    .modal { 
      background: var(--surface); border-radius: 8px; padding: 20px; min-width: 280px;
      box-shadow: var(--shadow-xl);
    }
    .modal h3 { font-size: 14px; margin-bottom: 12px; color: var(--text); }
    .modal input[type="text"] { 
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px; 
      font-size: 12px; outline: none; margin-bottom: 12px; background: var(--surface);
    }
    .modal input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-ring); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-btn { 
      padding: 6px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; 
      border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
    }
    .modal-btn:hover { background: var(--bg); }
    .modal-btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent-hover); }
    .modal-btn.primary:hover { background: var(--accent-hover); }

  </style>
</head>
<body>
  <div class="header">
    <h1>BlattamToby — Ctrl+T или + для новой вкладки</h1>
    <div class="header-actions">
      <button class="action-btn" id="theme-btn" title="Переключить тёмную/светлую тему">🌙</button>
      <button class="action-btn" id="select-btn" title="Выбрать все видимые">☑ Выбрать</button>
      <button class="action-btn" id="export-btn">↓ Экспорт</button>
      <button class="action-btn" id="import-btn">↑ Импорт</button>
      <input type="file" id="import-input" accept=".json" style="display:none;">
    </div>
  </div>

  <div class="container">
    <!-- Папки -->
    <div class="folders-bar" id="folders-bar">
      <button class="folder-chip active" data-folder-id="">Все</button>
      <button class="add-folder-btn" id="add-folder-btn">+ Папка</button>
    </div>

    <!-- Поиск -->
    <div class="search-row">
      <input type="text" class="search-box" placeholder="Поиск по вкладкам..." id="search">
    </div>

    <!-- Состояния -->
    <div id="empty-state" class="empty-state" style="display:none;">Нет сохранённых вкладок</div>
    <div id="no-results" class="no-results">Ничего не найдено</div>

    <!-- Карточки -->
    <div id="tabs-list" class="tabs-list"></div>
  </div>

  <!-- Панель выбора -->
  <div id="selection-bar" class="selection-bar hidden">
    <span id="selection-count" class="selection-count">0 выбрано</span>
    <button id="open-selected-btn" class="action-btn primary">Открыть</button>
    <button id="clear-selection-btn" class="action-btn">Сбросить</button>
  </div>

  <!-- Модалка: создать/переименовать папку -->
  <div class="modal-overlay" id="folder-modal">
    <div class="modal">
      <h3 id="modal-title">Новая папка</h3>
      <input type="text" id="folder-name-input" placeholder="Название..." autocomplete="off">
      <div class="modal-actions">
        <button class="modal-btn" id="modal-cancel">Отмена</button>
        <button class="modal-btn primary" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <script src="view.js"></script>
</body>
</html>
