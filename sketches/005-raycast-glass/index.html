<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toby — вкладки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c12;
    --glass:rgba(255,255,255,.06);
    --glass2:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.12);
    --line2:rgba(255,255,255,.08);
    --ink:#f5f7fa;
    --muted:#9aa4b2;
    --faint:#6b7484;
    --grad:linear-gradient(135deg,#3a7bfd,#8b5cf6,#ec4899);
    --glow:0 0 24px rgba(99,102,241,.25);
    --skel:rgba(255,255,255,.13);
    --skel-hd:rgba(255,255,255,.24);
    --skel-ph:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    font-feature-settings:'calt','kern','liga','ss03';
    font-size:14px;line-height:1.5;letter-spacing:.2px;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* deep dark gradient backdrop with ambient glows */
  body::before{
    content:'';position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(900px 520px at 18% -10%, rgba(58,123,253,.22), transparent 62%),
      radial-gradient(820px 500px at 85% -8%, rgba(139,92,246,.20), transparent 60%),
      radial-gradient(760px 480px at 55% 115%, rgba(236,72,153,.10), transparent 60%),
      linear-gradient(180deg,#0b0e17 0%, #0a0c12 45%, #090a10 100%);
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(420px 300px at 12% 40%, rgba(56,189,248,.06), transparent 70%),
      radial-gradient(460px 320px at 88% 55%, rgba(139,92,246,.07), transparent 70%);
  }
  ::selection{background:rgba(139,92,246,.45);color:#fff}
  button{font-family:inherit;cursor:pointer;letter-spacing:inherit}

  /* ---------- top bar (glass, hero search) ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    background:rgba(10,12,18,.55);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    box-shadow:inset 0 -1px 0 rgba(255,255,255,.07);
  }
  .topinner{position:relative;display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 24px}
  .wordmark{
    font-size:19px;font-weight:700;letter-spacing:.1px;user-select:none;
    background:linear-gradient(135deg,#8ab4ff 0%,#b39dff 45%,#f0a3d8 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 12px rgba(139,92,246,.35));
  }
  .wordmark small{font:500 10px/1 'Geist Mono',ui-monospace,monospace;color:var(--faint);-webkit-text-fill-color:var(--faint);letter-spacing:.12em;margin-left:6px;vertical-align:2px}

  /* command-palette hero search */
  .searchbox{
    position:absolute;left:50%;transform:translateX(-50%);
    width:min(640px,50vw);height:48px;border-radius:14px;
    display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--line);
    box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 8px 28px rgba(0,0,0,.45);
    transition:box-shadow .18s,border-color .18s,background .18s;
  }
  .searchbox:focus-within{
    background:rgba(255,255,255,.07);
    border-color:transparent;
    background-image:none;
    box-shadow:
      0 0 0 1px transparent inset,
      0 0 0 1.5px rgba(139,92,246,.75),
      0 0 0 6px rgba(99,102,241,.14),
      0 0 32px rgba(99,102,241,.38),
      0 8px 28px rgba(0,0,0,.5);
  }
  .searchbox .ico{color:var(--muted);flex:none}
  .searchbox input{
    flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;
    font:400 15px/1 'Inter',sans-serif;letter-spacing:.2px;color:var(--ink);
  }
  .searchbox input::placeholder{color:var(--faint)}
  .khint{display:flex;gap:4px;flex:none}
  .khint kbd{
    min-width:20px;height:20px;padding:0 5px;display:grid;place-items:center;
    font:500 10.5px/1 'Geist Mono',ui-monospace,monospace;color:var(--muted);
    border-radius:5px;letter-spacing:0;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 0 1px rgba(255,255,255,.12);
  }

  .topactions{display:flex;gap:8px}
  .tbtn{
    height:32px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);border-radius:10px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    font:500 12.5px/1 'Inter',sans-serif;color:var(--muted);letter-spacing:.2px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
    transition:background .12s,color .12s,box-shadow .12s,opacity .12s;
  }
  .tbtn:hover{background:rgba(255,255,255,.10);color:var(--ink)}
  .tbtn.on{
    background:linear-gradient(135deg,rgba(58,123,253,.30),rgba(139,92,246,.30),rgba(236,72,153,.22));
    border-color:rgba(139,92,246,.55);color:var(--ink);
    box-shadow:0 0 14px rgba(139,92,246,.28),inset 0 1px 0 rgba(255,255,255,.10);
  }
  .tbtn .glyph{font-size:12px;line-height:1}

  /* ---------- chips (glass pills) ---------- */
  .chips{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:16px 24px 2px}
  .chips .sep{width:1px;height:18px;background:rgba(255,255,255,.14);margin:0 7px;flex:none}
  .chip{
    position:relative;height:28px;padding:0 12px;border-radius:9999px;
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
    font:500 12.5px/1 'Inter',sans-serif;color:var(--muted);letter-spacing:.2px;
    transition:background .12s,color .12s,border-color .12s,box-shadow .12s;
  }
  .chip:hover{background:rgba(255,255,255,.10);color:var(--ink)}
  .chip.on{
    color:var(--ink);border-color:transparent;
    background:
      linear-gradient(rgba(38,42,72,.92),rgba(38,42,72,.92)) padding-box,
      var(--grad) border-box;
    box-shadow:0 0 14px rgba(139,92,246,.30),inset 0 1px 0 rgba(255,255,255,.10);
  }
  .chip.on::after{
    content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
    width:52%;height:2px;border-radius:2px;background:var(--grad);opacity:.9;
  }
  .chip.sub{margin-left:5px;padding-left:10px}
  .chip .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 6px currentColor}
  .chip .em{font-size:11px;line-height:1}

  /* ---------- meta row ---------- */
  .main{padding:0 24px}
  .metarow{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 14px}
  .metatitle{font-size:15px;font-weight:600;letter-spacing:.2px;display:flex;align-items:baseline;gap:9px;color:var(--ink)}
  .metatitle .n{font:500 11px/1 'Geist Mono',ui-monospace,monospace;color:var(--faint);letter-spacing:0}
  .metaright{font:500 10.5px/1 'Geist Mono',ui-monospace,monospace;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}

  /* ---------- grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;padding-bottom:120px}
  body.compact .grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr))}

  .card{
    position:relative;border-radius:13px;
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(20px) saturate(140%);
    -webkit-backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 18px rgba(0,0,0,.35);
    transition:box-shadow .16s,transform .16s,border-color .16s;
    cursor:pointer;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 28px rgba(0,0,0,.5),0 0 22px rgba(99,102,241,.20);
  }
  .card.sel{
    border-color:rgba(255,255,255,.4);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 6px 18px rgba(0,0,0,.4),0 0 0 1.5px rgba(139,92,246,.55),0 0 18px rgba(139,92,246,.22);
  }
  .card.kb{
    border-color:transparent;
    background:
      linear-gradient(rgba(255,255,255,.055),rgba(255,255,255,.05)) padding-box,
      var(--grad) border-box;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 0 0 4px rgba(139,92,246,.14),
      0 0 26px rgba(124,108,246,.38),
      0 10px 26px rgba(0,0,0,.45);
  }
  .card.kb.sel{
    background:
      linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.06)) padding-box,
      var(--grad) border-box;
  }
  .card.archived{opacity:.45}
  .card.archived:hover{opacity:.65}

  /* fake screenshot (pure CSS) */
  .thumb{position:relative;aspect-ratio:16/10;border-radius:12px 12px 0 0;overflow:hidden}
  .thumb::after{content:'';position:absolute;inset:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);pointer-events:none}
  .chrome{height:13px;display:flex;align-items:center;gap:5px;padding:0 7px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08)}
  .fav{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 5px rgba(255,255,255,.25)}
  .cbar{height:4px;max-width:76px;flex:1;border-radius:2px;background:rgba(255,255,255,.14)}
  .t{position:relative;padding:7px 8px;display:flex;flex-direction:column;gap:3px;height:calc(100% - 13px)}
  .l{display:block;height:3px;border-radius:2px;background:var(--skel);flex:none}
  .hd{height:5px;background:var(--skel-hd)}
  .w90{width:90%}.w85{width:85%}.w80{width:80%}.w75{width:75%}.w70{width:70%}.w65{width:65%}
  .w60{width:60%}.w55{width:55%}.w50{width:50%}.w45{width:45%}.w40{width:40%}
  .ph{height:28px;border-radius:3px;background:var(--skel-ph);flex:none}
  .code{flex:1;background:rgba(0,0,0,.25);border-radius:4px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .cl{height:2.5px;border-radius:2px;background:rgba(148,180,255,.30)}
  .cl:nth-child(odd){background:rgba(190,160,255,.30)}
  .ind{margin-left:8px}
  .t.vc{align-items:center;justify-content:center}
  .play{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;box-shadow:0 0 14px rgba(139,92,246,.35)}
  .play b{width:0;height:0;border-left:8px solid rgba(255,255,255,.65);border-top:5px solid transparent;border-bottom:5px solid transparent;margin-left:2px}
  .bl{display:block;height:3px;border-radius:2px;background:var(--skel);position:relative;margin-left:10px}
  .bl::before{content:'';position:absolute;left:-10px;top:-.5px;width:4px;height:4px;border-radius:1px;background:var(--skel-hd)}
  .road{position:absolute;background:rgba(255,255,255,.14);border-radius:2px}
  .r1{left:-10%;right:-10%;top:40%;height:3px;transform:rotate(-13deg)}
  .r2{top:-12%;bottom:-12%;left:56%;width:3px;transform:rotate(9deg)}
  .block{position:absolute;background:var(--skel-ph);border-radius:2px}
  .b1{left:8px;top:8px;width:28%;height:24%}
  .b2{right:10px;bottom:9px;width:32%;height:26%}
  .rect{display:block;border:1px solid rgba(255,255,255,.20);border-radius:3px;height:24px;width:54%;margin-top:3px}
  .rect.r2{width:36%;margin-top:5px}
  .cells{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .cells i{background:var(--skel-ph);border-radius:3px}
  .ava{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.28);flex:none;margin-bottom:2px}

  /* hover controls */
  .cb,.rm{
    position:absolute;display:grid;place-items:center;
    background:rgba(14,16,24,.72);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 0 0 1px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.10);
    opacity:0;transition:opacity .12s,background .1s,box-shadow .1s;
  }
  .cb{top:7px;left:7px;width:17px;height:17px;border-radius:5px;z-index:2}
  .cb::after{content:'';width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);opacity:0}
  .rm{top:6px;right:6px;width:19px;height:19px;border-radius:50%;font:400 11px/1 'Inter',sans-serif;color:var(--muted);z-index:2}
  .rm:hover{background:rgba(30,33,46,.9);color:#fff}
  .card:hover .cb,.card:hover .rm,body.selection-mode .cb{opacity:1}
  .card.sel .cb{opacity:1;background:var(--grad);box-shadow:0 0 10px rgba(139,92,246,.5),0 0 0 1px rgba(255,255,255,.25)}
  .card.sel .cb::after{opacity:1}
  .abadge{
    position:absolute;bottom:6px;right:6px;z-index:2;
    font:500 9px/1 'Geist Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em;
    color:var(--muted);background:rgba(14,16,24,.72);padding:3px 5px;border-radius:4px;
    box-shadow:0 0 0 1px rgba(255,255,255,.14);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }

  .cbody{padding:9px 11px 10px}
  .cname{font-size:13px;font-weight:500;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .curl{margin-top:3px;font:400 10.5px/1.4 'Geist Mono',ui-monospace,monospace;color:var(--faint);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctags{display:flex;gap:4px;margin-top:7px}
  .ctags i{width:6px;height:6px;border-radius:50%;box-shadow:0 0 5px currentColor}

  .empty{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
  .empty span{display:block;margin-top:6px;font-size:12.5px;color:var(--faint)}
  .empty button{
    margin-top:14px;height:30px;padding:0 14px;border-radius:9px;
    border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
    font:500 12.5px/1 'Inter',sans-serif;
  }
  .empty button:hover{background:rgba(255,255,255,.11)}

  /* ---------- selection bar (glass pill) ---------- */
  .selbar{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;
    display:flex;align-items:center;gap:11px;
    background:rgba(20,22,32,.72);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,.16);
    border-radius:9999px;padding:9px 11px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 14px 40px rgba(0,0,0,.55),0 0 26px rgba(99,102,241,.20);
    transition:opacity .16s,transform .16s;
  }
  .selbar.off{opacity:0;transform:translateX(-50%) translateY(14px);pointer-events:none}
  .selcount{font-size:13px;font-weight:500;letter-spacing:.2px;padding:0 3px 0 5px;white-space:nowrap;color:var(--ink)}
  .seldiv{width:1px;height:18px;background:rgba(255,255,255,.16)}
  .btn{height:30px;padding:0 14px;border:0;border-radius:9999px;font:600 12.5px/1 'Inter',sans-serif;letter-spacing:.2px;transition:opacity .12s,background .12s,box-shadow .12s}
  .btn-grad{
    background:var(--grad);color:#fff;
    box-shadow:0 0 16px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn-grad:hover{opacity:.88}
  .btn-ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--ink)}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(6px);z-index:70;
    background:rgba(20,22,32,.85);color:var(--ink);padding:9px 15px;border-radius:10px;
    font-size:12.5px;font-weight:500;letter-spacing:.2px;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.5);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){
    .searchbox{position:static;transform:none;width:auto;flex:1;margin:0 14px;max-width:none;height:42px}
    .topinner{height:auto;padding:12px 16px;flex-wrap:wrap;gap:10px}
    .topactions{width:100%;justify-content:flex-end}
    .khint{display:none}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topinner">
    <div class="wordmark">Toby<small>NEW TAB</small></div>
    <div class="searchbox">
      <svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Поиск во вкладках…" autocomplete="off" spellcheck="false">
      <span class="khint"><kbd>⌘</kbd><kbd>K</kbd></span>
    </div>
    <div class="topactions">
      <button class="tbtn" id="btnSelect" title="Режим выбора"><span class="glyph">☑</span>Выбрать</button>
      <button class="tbtn" id="btnSize" title="Размер сетки"><span class="glyph">▦</span>Размер</button>
      <button class="tbtn" id="btnSettings" title="Настройки"><span class="glyph">⚙</span></button>
    </div>
  </div>
</header>

<nav class="chips" id="chips">
  <span>
    <button class="chip folder on" data-type="folder" data-filter="all">Все</button>
  </span>
  <span>
    <button class="chip folder" data-type="folder" data-filter="work">Работа</button>
  </span>
  <span>
    <button class="chip folder" data-type="folder" data-filter="home">Дома</button>
  </span>
  <span>
    <button class="chip folder sub" data-type="folder" data-filter="projects">↳ Проекты</button>
  </span>
  <i class="sep"></i>
  <span>
    <button class="chip" data-type="special" data-filter="arch"><span class="em">🗄</span>Архив</button>
  </span>
  <span>
    <button class="chip" data-type="special" data-filter="freq"><span class="em">⭐</span>Частые</button>
  </span>
  <span>
    <button class="chip" data-type="special" data-filter="star"><span class="em">🕘</span>Избранные</button>
  </span>
  <i class="sep"></i>
  <span id="tagChips"></span>
  <i class="sep"></i>
  <span>
    <button class="chip" data-type="session" data-filter="sess-1021"><span class="em">📋</span>Сессия 21.10</button>
  </span>
  <span>
    <button class="chip" data-type="session" data-filter="sess-work"><span class="em">📋</span>Работа</button>
  </span>
</nav>

<main class="main">
  <div class="metarow">
    <div class="metatitle"><span id="metaLabel">Все вкладки</span><span class="n" id="metaCount">12</span></div>
    <div class="metaright">обновлено 21.10 · 14:32</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    Ничего не найдено.
    <span>Попробуйте изменить запрос или сбросить фильтры.</span>
    <button id="btnResetFilters">Сбросить фильтры</button>
  </div>
</main>

<div class="selbar" id="selbar">
  <span class="selcount" id="selcount">3 выбрано</span>
  <i class="seldiv"></i>
  <button class="btn btn-grad" id="btnOpen">Открыть</button>
  <button class="btn btn-ghost" id="btnReset">Сбросить</button>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const TAGS = {
  'код':        { c:'#5b9bff' },
  'дизайн':     { c:'#a78bfa' },
  'новости':    { c:'#f87171' },
  'учёба':      { c:'#4ade80' },
  'инструменты':{ c:'#fb923c' }
};

/* per-card cool-toned dark gradient for the fake screenshot */
const CARDS = [
  { t:'Документация — Python',            u:'docs.python.org/3',                    f:'work',                 tags:['код'],            s:['sess-1021'],              fav:'#5b6b8c', v:'docs',   sel:1, freq:1, g:['#14213a','#0d1524'] },
  { t:'GitHub — BlattamRoach/BlattamToby',u:'github.com/BlattamRoach/BlattamToby',  f:'work projects',        tags:['код','инструменты'],s:['sess-1021','sess-work'],fav:'#3d3f44', v:'code',   kb:1, star:1, g:['#1b1f3d','#101326'] },
  { t:'MDN Web Docs',                     u:'developer.mozilla.org',                f:'work',                 tags:['код'],            s:['sess-1021'],              fav:'#6b7280', v:'docs',   g:['#102531','#0c1620'] },
  { t:'Figma — наработка',                u:'figma.com/file/8a2k…/наработка',       f:'work',                 tags:['дизайн'],         s:['sess-work'],              fav:'#9d8fc0', v:'design', star:1, g:['#251a41','#150f2b'] },
  { t:'Хабр',                             u:'habr.com',                             f:'home',                 tags:['новости'],        s:['sess-1021'],              fav:'#7a8a99', v:'news',   sel:1, freq:1, star:1, g:['#17253f','#0f1728'] },
  { t:'Lenta.ru',                         u:'lenta.ru',                             f:'home',                 tags:['новости'],        s:['sess-1021'],              fav:'#8a8f98', v:'news',   g:['#1e2338','#12152a'] },
  { t:'YouTube',                          u:'youtube.com',                          f:'home',                 tags:[],                 s:['sess-1021'],              fav:'#a35d5d', v:'video',  freq:1, g:['#131d33','#0d1322'] },
  { t:'Notion — заметки',                 u:'notion.so/toby-notes',                 f:'home',                 tags:['учёба'],          s:['sess-1021'],              fav:'#5f6368', v:'notes',  sel:1, freq:1, star:1, g:['#191b36','#101226'] },
  { t:'Яндекс Карты',                     u:'yandex.ru/maps',                       f:'home',                 tags:[],                 s:[],                         fav:'#7d8aa0', v:'map',    g:['#0f2434','#0b1622'] },
  { t:'Golang — stdlib',                  u:'pkg.go.dev/std',                       f:'work projects',        tags:['код'],            s:['sess-work'],              fav:'#4f6d8a', v:'code',   g:['#122339','#0c1424'] },
  { t:'Figma Community',                  u:'figma.com/community',                  f:'work',                 tags:['дизайн'],         s:['sess-work'],              fav:'#9d8fc0', v:'grid',   freq:1, g:['#231a3c','#140f28'] },
  { t:'VK',                               u:'vk.com',                               f:'home',                 tags:[],                 s:[],                         fav:'#6b83a8', v:'social', arch:1, g:['#151f36','#0e1424'] }
];

const grid      = document.getElementById('grid');
const search    = document.getElementById('search');
const selbar    = document.getElementById('selbar');
const selcount  = document.getElementById('selcount');
const metaLabel = document.getElementById('metaLabel');
const metaCount = document.getElementById('metaCount');
const emptyEl   = document.getElementById('empty');
const toastEl   = document.getElementById('toast');

const selected = new Set();
let activeFolder = 'all';
const activeTags = new Set(), activeSpecial = new Set(), activeSessions = new Set();

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, d = a % 10;
  if (a > 10 && a < 20) return many;
  if (d > 1 && d < 5)  return few;
  if (d === 1)         return one;
  return many;
}

function thumbHTML(c){
  const inner = {
    docs:   '<div class="t"><i class="l w45 hd"></i><i class="l w90"></i><i class="l w80"></i><i class="l w85"></i><i class="l w60"></i></div>',
    code:   '<div class="t"><div class="code"><i class="cl w70"></i><i class="cl w90"></i><i class="cl ind w60"></i><i class="cl ind w75"></i><i class="cl w50"></i></div></div>',
    news:   '<div class="t"><i class="ph"></i><i class="l w80"></i><i class="l w65"></i></div>',
    video:  '<div class="t vc"><span class="play"><b></b></span></div>',
    notes:  '<div class="t"><i class="bl w70"></i><i class="bl w85"></i><i class="bl w55"></i><i class="bl w75"></i></div>',
    map:    '<div class="t"><i class="road r1"></i><i class="road r2"></i><i class="block b1"></i><i class="block b2"></i></div>',
    grid:   '<div class="t"><div class="cells"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>',
    design: '<div class="t"><i class="l w45 hd"></i><i class="rect"></i><i class="rect r2"></i></div>',
    social: '<div class="t"><span class="ava"></span><i class="l w50"></i><i class="l w70"></i><i class="l w40"></i></div>'
  }[c.v];
  const badge = c.arch ? '<span class="abadge">архив</span>' : '';
  return '<div class="thumb" style="background:linear-gradient(135deg,' + c.g[0] + ',' + c.g[1] + ')">'
       + '<div class="chrome"><i class="fav" style="background:' + c.fav + '"></i><span class="cbar"></span></div>'
       + inner
       + '<button class="cb" tabindex="-1" aria-label="Выбрать"></button>'
       + '<button class="rm" tabindex="-1" aria-label="Удалить">✕</button>'
       + badge + '</div>';
}

// tag chips
const tagWrap = document.getElementById('tagChips');
Object.keys(TAGS).forEach(name => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.dataset.type = 'tag';
  b.dataset.filter = name;
  b.innerHTML = '<i class="dot" style="background:' + TAGS[name].c + ';color:' + TAGS[name].c + '"></i>' + name;
  tagWrap.appendChild(b);
});

// build cards
CARDS.forEach(c => {
  const el = document.createElement('article');
  el.className = 'card' + (c.sel ? ' sel' : '') + (c.kb ? ' kb' : '') + (c.arch ? ' archived' : '');
  el.dataset.name = (c.t + ' ' + c.u).toLowerCase();
  el.innerHTML = thumbHTML(c)
    + '<div class="cbody"><div class="cname">' + c.t + '</div><div class="curl">' + c.u + '</div>'
    + (c.tags.length ? '<div class="ctags">' + c.tags.map(t => '<i style="background:' + TAGS[t].c + ';color:' + TAGS[t].c + '" title="' + t + '"></i>').join('') + '</div>' : '')
    + '</div>';
  c.el = el;
  if (c.sel) selected.add(el);
  grid.appendChild(el);
});

/* ---------- filtering ---------- */
function applyFilters(){
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  CARDS.forEach(c => {
    const el = c.el;
    if (!el.isConnected) return;
    let ok = true;
    if (ok && q) ok = el.dataset.name.includes(q);
    if (ok && activeFolder !== 'all') ok = c.f.includes(activeFolder);
    if (ok && activeTags.size) ok = [...activeTags].every(t => c.tags.includes(t));
    if (ok && activeSpecial.has('arch')) ok = !!c.arch;
    if (ok && activeSpecial.has('freq')) ok = !!c.freq;
    if (ok && activeSpecial.has('star')) ok = !!c.star;
    if (ok && activeSessions.size) ok = [...activeSessions].every(s => c.s.includes(s));
    el.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  metaCount.textContent = shown;
  emptyEl.hidden = shown !== 0;
}

function folderLabel(f){
  return { all:'Все вкладки', work:'Работа', home:'Дома', projects:'Проекты' }[f] || 'Все вкладки';
}

/* ---------- selection ---------- */
function updateBar(){
  const n = selected.size;
  selcount.textContent = n + ' ' + plural(n, 'выбрана', 'выбрано', 'выбрано');
  selbar.classList.toggle('off', n === 0);
}
function toggleSel(card){
  card.classList.toggle('sel');
  if (card.classList.contains('sel')) selected.add(card); else selected.delete(card);
  updateBar();
}
function clearSel(){
  selected.forEach(el => el.classList.remove('sel'));
  selected.clear();
  updateBar();
}
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

grid.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (e.target.closest('.rm')){
    selected.delete(card);
    card.style.transition = 'opacity .15s, transform .15s';
    card.style.opacity = '0';
    card.style.transform = 'scale(.97)';
    setTimeout(() => { card.remove(); applyFilters(); }, 150);
    updateBar();
    return;
  }
  toggleSel(card);
});

document.getElementById('btnReset').addEventListener('click', clearSel);
document.getElementById('btnOpen').addEventListener('click', () => {
  const n = selected.size;
  if (!n) return;
  toast('Открываю ' + n + ' ' + plural(n, 'вкладку', 'вкладки', 'вкладок') + '…');
  setTimeout(clearSel, 400);
});

/* ---------- chips ---------- */
document.getElementById('chips').addEventListener('click', e => {
  const ch = e.target.closest('.chip');
  if (!ch) return;
  const type = ch.dataset.type, f = ch.dataset.filter;
  if (type === 'folder'){
    document.querySelectorAll('.chip.folder').forEach(x => x.classList.remove('on'));
    ch.classList.add('on');
    activeFolder = f;
    metaLabel.textContent = folderLabel(f);
  } else if (type === 'tag'){
    ch.classList.toggle('on');
    ch.classList.contains('on') ? activeTags.add(f) : activeTags.delete(f);
  } else if (type === 'special'){
    ch.classList.toggle('on');
    ch.classList.contains('on') ? activeSpecial.add(f) : activeSpecial.delete(f);
  } else {
    ch.classList.toggle('on');
    ch.classList.contains('on') ? activeSessions.add(f) : activeSessions.delete(f);
  }
  applyFilters();
});

document.getElementById('btnResetFilters').addEventListener('click', () => {
  search.value = '';
  activeFolder = 'all';
  activeTags.clear(); activeSpecial.clear(); activeSessions.clear();
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x.dataset.filter === 'all'));
  metaLabel.textContent = 'Все вкладки';
  applyFilters();
});

/* ---------- search & keys ---------- */
search.addEventListener('input', applyFilters);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (selected.size) clearSel();
    else if (search.value){ search.value = ''; applyFilters(); search.blur(); }
  } else if ((e.metaKey && (e.key === 'k' || e.key === 'K')) || ((e.ctrlKey) && (e.key === 'k' || e.key === 'K'))){
    e.preventDefault();
    search.focus();
    search.select();
  } else if (e.key === '/' && document.activeElement !== search){
    e.preventDefault();
    search.focus();
    search.select();
  }
});

/* ---------- top actions ---------- */
document.getElementById('btnSelect').addEventListener('click', function(){
  document.body.classList.toggle('selection-mode');
  this.classList.toggle('on');
});
document.getElementById('btnSize').addEventListener('click', function(){
  document.body.classList.toggle('compact');
  this.classList.toggle('on');
});
document.getElementById('btnSettings').addEventListener('click', () => {
  toast('Настройки — скоро');
});

/* ---------- init ---------- */
updateBar();
applyFilters();
</script>
</body>
</html>
